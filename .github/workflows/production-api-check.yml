name: Production API smoke check

on:
  push:
    branches:
      - fix/nonblocking-live-ccu-enrichment-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe published Cloudflare endpoints
        run: node scripts/check-production.mjs
