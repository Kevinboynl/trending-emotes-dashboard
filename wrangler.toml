name = "trending-emotes-dashboard"
main = "worker.js"
compatibility_date = "2026-11-22"
workers_dev = true

# The dashboard works without a database, but history will be stored in
# each visitor's browser only until you add a Cloudflare D1 binding named DB.
# Once D1 is added, the scheduled job tracks game stats even with no visitors.
[triggers]
crons = ["*/5 * * * *"]

# Only explicitly selected aggregated analytics are shown publicly.
# Owner-approved on 2026-11-22: PayingUsers, DailyRevenue, ARPDAU and
# ARPPU are intentionally published alongside payer conversion rate.
# These metrics can reveal business revenue: remove them to make private again.
# The Roblox API key must remain a Cloudflare Secret named ROBLOX_ANALYTICS_API_KEY.
[vars]
PUBLIC_ANALYTICS_METRICS = "DailyActiveUsers,Visits,AverageSessionLengthMinutes,AveragePlayTimeMinutesPerDAU,ForwardD1Retention,ForwardD7Retention,ForwardD30Retention,UniqueUsersWithImpressions,ThumbnailImpressions,UniqueUsersWithClicks,ImpressionCVR,ClickCVR,EndToEndCVR,ClientFpsAvg,ClientCrashRate15m,ClientMemoryUsageAvg,ClientCpuTimeAvg,PayingUsersCVR,PayingUsers,DailyRevenue,AverageRevenuePerUser,AverageRevenuePerPayingUser"

# Per-Cloudflare-location protection for public API endpoints. This binding
# never stores or exposes the Roblox API key. Limits apply per endpoint and
# connecting IP; local Workers also implement a bounded fallback limiter.
# Requires Wrangler 4.36+ for Cloudflare's Rate Limiting binding.
[[ratelimits]]
name = "PUBLIC_API_LIMITER"
namespace_id = "2026112201"
  [ratelimits.simple]
  limit = 60
  period = 60

# Shared, five-minute measured history (owner's Cloudflare D1 database)
[[d1_databases]]
binding = "DB"
database_name = "trending-emotes-metrics"
database_id = "c8290c80-ccd7-4db0-91ac-0a631bd35e6b"
